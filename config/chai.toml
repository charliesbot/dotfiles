platforms = ['claude', 'antigravity', 'opencode', 'codex', 'cursor', 'pi']

instructions = [
  '~/dotfiles/ai/instructions/AGENTS.md',
  '~/dotfiles/ai/instructions/ADHD.md',
]

[mcp.gcloud]
command = "npx"
args = ["-y", "@google-cloud/gcloud-mcp"]

[mcp.pencil]
command = "/Applications/Pencil.app/Contents/Resources/app.asar.unpacked/out/mcp-server-darwin-arm64"
args = ["--app", "desktop"]

[mcp.cloud-run]
command = "npx"
args = ["-y", "@google-cloud/cloud-run-mcp"]

[mcp.firebase-mcp-server]
command = "npx"
args = ["-y", "firebase-tools@latest", "mcp"]

[mcp.tolaria]
command = "/opt/homebrew/bin/node"
args = ["/Applications/Tolaria.app/Contents/Resources/mcp-server/index.js"]
env = { WS_UI_PORT = "9711" }

[mcp.engram]
command = "/opt/homebrew/bin/engram"
args = ["mcp", "--tools=agent"]

[skills]
local = ['~/dotfiles/ai/skills', '~/projects/chai/skills']

[[skills.github]]
url = 'https://github.com/addyosmani/agent-skills'
