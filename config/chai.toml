platforms = ['antigravity', 'opencode', 'codex', 'claude']

instructions = [
  '~/projects/skills/instructions/AGENTS.md',
  '~/projects/skills/instructions/ADHD.md',
]

[subagents]
paths = ["~/projects/skills/subagents/*.md"]

[mcp.gcloud]
command = "npx"
args = ["-y", "@google-cloud/gcloud-mcp"]

[mcp.cloud-run]
command = "npx"
args = ["-y", "@google-cloud/cloud-run-mcp"]

[mcp.firebase-mcp-server]
command = "npx"
args = ["-y", "firebase-tools@latest", "mcp"]

[skills]
local = [
  '~/projects/skills/skills',
  '~/projects/chai/skills',
  '~/projects/android-design/skills',
]

[[skills.github]]
