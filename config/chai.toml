platforms = ["claude", "antigravity", "opencode", "codex", "cursor"]

instructions = "~/dotfiles/ai/instructions/AGENTS.md"

[deps]
agent-skills = "https://github.com/addyosmani/agent-skills"
android-skills = "https://github.com/android/skills"
herdr = "https://github.com/ogulcancelik/herdr"
jj-skill = "https://github.com/megumish/jj-skill"
kotlin-compose-android-skills = "https://github.com/chrisbanes/skills"
mattpocock-skills = "https://github.com/mattpocock/skills"
modern-web-guidance = "https://github.com/GoogleChrome/modern-web-guidance"
stitch-skills = "https://github.com/google-labs-code/stitch-skills"
emil-kowalski-skills = "https://github.com/emilkowalski/skills"

[skills]
paths = [
  "~/dotfiles/ai/skills/*",
  # Addy Osmani Agent Skills
  "@agent-skills/skills/code-simplification",
  "@agent-skills/skills/context-engineering",
  "@agent-skills/skills/incremental-implementation",
  "@agent-skills/skills/planning-and-task-breakdown",
  "@agent-skills/skills/source-driven-development",
  # Android Skills
  "@android-skills/device-ai/*",
  "@android-skills/devtools/*",
  "@android-skills/jetpack-compose/*",
  "@android-skills/navigation/*",
  "@android-skills/performance/*",
  "@android-skills/system/*",
  "@android-skills/testing/*",
  "@android-skills/wear/*",
  "@android-skills/xr/*",
  # Emil Kowalski Skills
  "@emil-kowalski-skills/skills/*",
  # Herdr Skills
  "@herdr/SKILL.md",
  # JJ Skill
  "@jj-skill/skills/jj",
  # Kotlin Compose Android Skills
  "@kotlin-compose-android-skills/skills/*",
  # Matt Pocock Skills
  "@mattpocock-skills/skills/productivity/*",
  # Modern Web Guidance
  "@modern-web-guidance/skills/*",
  # Stitch Skills
  "@stitch-skills/skills/design-md",
  "@stitch-skills/skills/enhance-prompt",
  "@stitch-skills/skills/taste-design",
]

[subagents]
paths = ["~/dotfiles/ai/subagents/*"]

[mcp.gcloud]
command = "npx"
args = ["-y", "@google-cloud/gcloud-mcp"]

[mcp.pencil]
command = "/Applications/Pencil.app/Contents/Resources/app.asar.unpacked/out/mcp-server-darwin-arm64"
args = ["--app", "desktop"]

[mcp.cloud-run]
command = "npx"
args = ["-y", "@google-cloud/cloud-run-mcp"]

[mcp.firebase-mcp-server]
command = "npx"
args = ["-y", "firebase-tools@latest", "mcp"]

[mcp.tolaria]
command = "/opt/homebrew/bin/node"
args = ["/Applications/Tolaria.app/Contents/Resources/mcp-server/index.js"]
env = { WS_UI_PORT = "9711" }
type = "stdio"
